<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <style>
        .code-container {
            /* background-color: #1e1e1e; */
            background-color: #f0f4f9;
            /* สีพื้นหลัง */
            border-radius: 5px;
            /* ขอบโค้งมน */
            margin-bottom: 1em;
            width: 80%;
            /* กำหนดความกว้างของกรอบ */
            max-width: 700px;
            /* กำหนดความกว้างสูงสุด */
            overflow: hidden;
            border: 1px solid #333;
            /* เพิ่มขอบสีเทาเข้ม */
        }

        .code-header {
            /* background-color: #252526; */
            background-color: #f0f4f9;
            /* สีพื้นหลังส่วนหัว */
            color: #d4d4d4;
            /* สีข้อความในส่วนหัว */
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #3e3e3e;
            border-top-left-radius: 5px;
            border-top-right-radius: 5px;
        }

        .logo {
            font-weight: bold;
            font-size: 0.9em;
            /* ขนาดตัวอักษรโลโก้ */
        }

        .copy-button i {
            font-size: 1.2em;
            /* ปรับขนาดไอคอน */
            color: #d4d4d4;
            /* ปรับสีไอคอน */
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .copy-button:hover i {
            opacity: 1;
        }

        .copy-button {
            background-color: transparent;
            border: none;
            padding: 0;
            cursor: pointer;
        }

        .copy-button img {
            width: 20px;
            /* ขนาดความกว้างของไอคอน */
            height: 20px;
            /* ขนาดความสูงของไอคอน */
            opacity: 0.7;
            transition: opacity 0.3s ease;
        }

        .copy-button img:hover {
            opacity: 1;
        }

        .code-block {
            padding: 12px;
            overflow-x: auto;
            font-family: monospace, monospace;
            color: #dcdcaa;
            /* สีข้อความโค้ด */
            white-space: pre-wrap;
            font-size: 0.85em;
            /* ขนาดตัวอักษรโค้ด */
            line-height: 1.4;
            /* ระยะห่างบรรทัด */
        }

        .code-block code {
            display: block;
        }
    </style>
</head>

<body>
    <div class="code-container">
        <div class="code-header">
            <div class="logo">HTML</div>
            <button class="copy-button">
                <i class="fas fa-copy"></i>
            </button>
            <!-- <button class="copy-button">
                <img src="clipboard-icon.png" alt="คัดลอก" width="20" height="20">
            </button> -->
            <!-- <button class="copy-button">
                <img src="path/to/copy-icon.svg" alt="คัดลอก" width="20" height="20">
            </button> -->
        </div>
        <pre class="code-block">
          <code>
            &lt;!DOCTYPE html&gt;<br>
            &lt;html&gt;<br>
            &lt;head&gt;<br>
              &lt;title&gt;หน้าเว็บตัวอย่าง&lt;/title&gt;<br>
            &lt;/head&gt;<br>
            &lt;body&gt;<br>
              &lt;h1&gt;สวัสดีชาวโลก&lt;/h1&gt;<br>
            &lt;/body&gt;<br>
            &lt;/html&gt;
          </code>
        </pre>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const copyButtons = document.querySelectorAll('.copy-button');

            copyButtons.forEach(button => {
                button.addEventListener('click', function () {
                    const codeBlock = this.parentNode.nextElementSibling.querySelector('code');
                    const codeText = codeBlock.textContent;

                    navigator.clipboard.writeText(codeText)
                        .then(() => {
                            alert('คัดลอกโค้ดแล้ว!');
                        })
                        .catch(err => {
                            console.error('ไม่สามารถคัดลอกโค้ดได้: ', err);
                        });
                });
            });
        });
    </script>
</body>

</html>
