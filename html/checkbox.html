<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="#" autocomplete="on">
        เพศ
        <input type="radio" name="gender" value="male"> ชาย
        <input type="radio" name="gender" value="female"> หญิง

        name: <input type="text" name="fname" placeholder="ชื่อ" style="
            font-size: 20px; 
            background: #eee; 
            border-radius: 10px; 
            border: 1px solid black;
            padding: 10px;
        ">
        surname: <input type="text" name="lname" placeholder="นามสกุล" style="
                            font-size: 20px; 
                            background: #eee; 
                            border-radius: 10px; 
                            border: 1px solid black;
                            padding: 10px;
        ">
        <br>
        Proficient computer language: 
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="html">html
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="css">css
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="javascript">javascript
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="jquery">jquery
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="php">php
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="python">python
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="flutter">flutter
        <br>
        <input type="checkbox"
                        name="lang" 
                        value="wordpress">wordpress
        <br>
        <input type="submit" value="send" style="
                    cursor: pointer; 
                    border: 1px solid black;
        ">
        <input type="reset" value="reset" style="
                    cursor: pointer; 
                    border: 1px solid black;
        ">
    </form>
    
    <br>
</body>
</html>
