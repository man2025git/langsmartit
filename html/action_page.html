<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ผลลัพธ์การค้นหา</title>
</head>
<body>
    
  <h2>ผลลัพธ์การค้นหา</h2>

  <p>คุณได้ป้อนคำค้นหา:</p>
  <div id="search-term"></div>

  <p>เนื่องจากเป็นเพียงตัวอย่าง HTML ฝั่ง Client เท่านั้น เราจึงไม่สามารถแสดงผลลัพธ์การค้นหาจริงได้</p>

  <script>
    // ดึงค่าพารามิเตอร์ 'q' จาก URL
    const urlParams = new URLSearchParams(window.location.search);
    const searchTerm = urlParams.get('q');

    // แสดงคำค้นหาใน div ที่มี id="search-term"
    if (searchTerm) {
      document.getElementById('search-term').textContent = searchTerm;
    } else {
      document.getElementById('search-term').textContent = "ไม่มีคำค้นหา";
    }
  </script>
</body>
</html>
