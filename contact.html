<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>langsmartit</title>

    <!-- css -->
    <link rel="stylesheet" href="css/stylecontact.css">

    <!-- icon langsmartit -->
    <link rel="Icon" href="images/logo/langsmartit.webp">

</head>

<body>


    <div class="grid-container">
        <header class="header_menu">
            <div class="menubar">
                <div class="logo">

                    <div class="logo-img">
                        <img src="images/logo/langsmartit_brand.png" alt="">
                        <a href="index.html">
                            <span>
                                Langsmartit
                            </span>
                        </a>
                    </div>

                    <div class="navbartogger">
                        <div class="menuopen">
                            <img src="images/menuwhite.webp" alt="">
                        </div>
                        <div class="menuclose">
                            <img src="images/closewhite.webp" alt="">
                        </div>
                    </div>

                </div>

                <nav class="navbarmenu">
                    <ul>
                        <li><a href="index.html"><span class="un">home</span></a></li>
                        <li><a href="about.html"><span class="un">about</span></a></li>
                        <li><a href="blog.html"><span class="un">blog</span></a></li>
                        <li><a href="service.html"><span class="un">service</span></a></li>
                        <li><a href="contact.html"><span class="un">contact</span></a></li>
                    </ul>
                </nav>
            </div>

        </header>
        <main class="contact_main">
            <div class="contact_header">
                Let's Get In Touch!
            </div>
            <div class="contact_container">
                <div class="detail-contact">
                    <div class="row-contact">
                        <div class="col-contact">
                            <div>
                                <input type="text" id="Namemail" placeholder="Name">
                            </div>
                            <div>
                                <input type="text" id="Phonemail" placeholder="Phone Number" />
                            </div>
                            <div>
                                <input type="email" id="Emailaddress" placeholder="Email" />
                            </div>
                            <div>
                                <textarea id="Messagemail" class="message-box" placeholder="Message" /></textarea>
                            </div>
                            <!-- <div>
                                <button>aaa</button>
                            </div> -->
                            <div class="send-contact">
                                <button onclick="contactmail()">SEND mail
                                </button>
                            </div>
    
                        </div>
                    </div>
                </div>
                <div class="contact-map">
                    <iframe
                        src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3951.8106920241694!2d98.38990390608215!3d7.9148342076736276!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3050312b3efb39fb%3A0xaf272edf2a649252!2slangsmartit!5e0!3m2!1sth!2sth!4v1744903328895!5m2!1sth!2sth"
                        allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
    
        </main>
        <footer>Footer</footer>
    </div>


    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"
        integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="js/scriptcontact.js"></script>
</body>

</html>
